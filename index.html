<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>王者峡谷守卫战</title>
<style>
html,body{margin:0;padding:0;height:100%;background:#31402e;overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;}
#game{display:block;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,.4);}
#hint{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.55);color:#ffe9a8;padding:6px 16px;border-radius:18px;font-size:14px;display:none;pointer-events:none;z-index:10;}
</style>
</head>
<body>
<div id="hint">横屏体验更好</div>
<canvas id="game"></canvas>
<script>
(function(){
'use strict';
var canvas=document.getElementById('game');
var ctx=canvas.getContext('2d');
var W=960,H=540,TAU=Math.PI*2;

/* ================= 布局（逻辑分辨率 960x540） ================= */
var TOP=96;                                  // 顶部卡片栏高度
var LAWN={x:110,y:100,cw:86,ch:80,cols:9,rows:5}; // 草坪格子 86x80
var LAWN_R=LAWN.x+LAWN.cw*LAWN.cols;         // 884
var LAWN_B=LAWN.y+LAWN.ch*LAWN.rows;         // 500
function cellCX(c){return LAWN.x+c*LAWN.cw+43;}
function cellCY(r){return LAWN.y+r*LAWN.ch+40;}

/* ================= 角色定义 ================= */
var CARDS=[
 {key:'cai',  name:'蔡文姬',  cost:50,  cd:3, hp:280, desc:'经济·产阳光'},
 {key:'hou',  name:'后羿',    cost:100, cd:3, hp:300, desc:'射手·金箭'},
 {key:'wang', name:'王昭君',  cost:150, cd:4, hp:300, desc:'冰控·减速'},
 {key:'xiang',name:'项羽',    cost:75,  cd:5, hp:900, desc:'肉盾·扛揍'},
 {key:'ang',  name:'安琪拉',  cost:175, cd:8, hp:300, desc:'爆发·3x3秒杀'},
 {key:'lu',   name:'鲁班七号',cost:200, cd:6, hp:300, desc:'连射·双枪'}
];
var CARD_X0=136,CARD_W=122,CARD_H=84,CARD_Y=6,CARD_GAP=4;
function cardRect(i){return {x:CARD_X0+i*(CARD_W+CARD_GAP),y:CARD_Y,w:CARD_W,h:CARD_H};}

var ZDEF={
 arthur:{name:'亚瑟',  hp:120,speed:11,  dmg:70, atkCd:1.0,r:22,bubble:'正义不会迟到！'},
 hanxin:{name:'韩信',  hp:80, speed:17.6,dmg:60, atkCd:0.8,r:20,bubble:'在下先走一步！'},
 cheng: {name:'程咬金',hp:280,speed:8.5, dmg:80, atkCd:1.1,r:28,bubble:'我还能再战三百回合！'},
 lvbu:  {name:'吕布',  hp:400,speed:7,   dmg:110,atkCd:0.9,r:32,boss:true,bubble:'我的貂蝉呢！'}
};
var WAVES=[
 [['arthur',3]],
 [['arthur',4],['hanxin',2]],
 [['arthur',3],['hanxin',2],['cheng',1]],
 [['arthur',4],['hanxin',3],['cheng',2],['lvbu',1]],
 [['arthur',5],['hanxin',3],['cheng',2],['lvbu',2]]
];

/* ================= 状态 ================= */
var state='menu',paused=false,speed=1,time=0,sun=150,kills=0;
var defenders=[],zombies=[],projectiles=[],particles=[],texts=[],pickups=[],mowers=[];
var grid=[],cardCd={},selected=-1,hoverCell=null,cellFlash=null;
var wave=0,queue=[],spawnT=0,interT=0,banner='',bannerT=0,skyT=3;
var mouse={x:-999,y:-999};
var BTN_PAUSE={x:894,y:4,w:60,h:44};
var BTN_SPEED={x:894,y:50,w:60,h:44};
var BTN_MUTE={x:894,y:96,w:60,h:44};
var BTN_COLLECT={x:778,y:494,w:156,h:44};
var BTN_START={x:W/2-130,y:336,w:260,h:64};
var BTN_RESTART={x:W/2-120,y:368,w:240,h:60};

/* ---- 数量上限（性能保护，超出丢最旧） ---- */
var MAX_PARTICLES=80,MAX_TEXTS=24,MAX_PROJ=40,MAX_PICKUPS=30;
function pushArr(arr,item,max){if(arr.length>=max)arr.shift();arr.push(item);}
function pushTxt(t){pushArr(texts,t,MAX_TEXTS);}

/* ================= 小工具 ================= */
function C(x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();}
function CS(x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.stroke();}
function RR(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function LN(a,b,c,d){ctx.beginPath();ctx.moveTo(a,b);ctx.lineTo(c,d);ctx.stroke();}
function inR(x,y,r){return x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h;}
function limb(x1,y1,x2,y2,w,col){ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineCap='round';LN(x1,y1,x2,y2);}
function shard(x,y,r){ctx.beginPath();ctx.moveTo(x,y-r);ctx.lineTo(x+r*0.6,y);ctx.lineTo(x,y+r);ctx.lineTo(x-r*0.6,y);ctx.closePath();ctx.fill();}

/* ================= 官方头像 → 头部圆盘离线合成 ================= */
/* 每个英雄头像加载完成后一次性绘制到 offscreen canvas（圆形裁剪只在此做一次），
   之后每帧仅 drawImage，杜绝每帧 clip。 */
var IMG_SRC={
 cai:'assets/caiwenji.png',hou:'assets/houyi.png',wang:'assets/wangzhaojun.png',
 xiang:'assets/xiangyu.png',ang:'assets/angela.png',lu:'assets/luban.png',
 arthur:'assets/yase.png',hanxin:'assets/hanxin.png',cheng:'assets/chengYaojin.png',lvbu:'assets/lvbu.png'
};
var DEF_RING={cai:'#f49ac1',hou:'#d9483b',wang:'#a8d4ee',xiang:'#c9a441',ang:'#e0483a',lu:'#e8862a'};
var Z_RING={arthur:'#4a6a9a',hanxin:'#8a8f9a',cheng:'#5a9a4a',lvbu:'#4a2a4a'};
var HERO_CHAR={cai:'蔡',hou:'羿',wang:'昭',xiang:'项',ang:'安',lu:'鲁',arthur:'瑟',hanxin:'信',cheng:'金',lvbu:'吕'};
var IMG_CACHE={};
(function preloadImgs(){
 for(var k in IMG_SRC){(function(key){
  var rec={el:null,ok:false,failed:false,disc:null};IMG_CACHE[key]=rec;
  try{
   var im=new Image();
   im.onload=function(){rec.ok=true;};
   im.onerror=function(){rec.ok=false;rec.failed=true;rec.el=null;};
   im.src=IMG_SRC[key];
   rec.el=im;
  }catch(e){rec.failed=true;}
 })(k);}
})();
var DISC_SZ=72,DISC_R=33;                 // 圆盘画布72px，圆盘半径33
function makeDisc(key){
 var rec=IMG_CACHE[key];if(!rec)return null;
 if(rec.disc)return rec.disc;
 if(!rec.ok&&!rec.failed)return null;      // 尚未加载完成，先不合成
 var cv=document.createElement('canvas');cv.width=DISC_SZ;cv.height=DISC_SZ;
 var c=cv.getContext('2d');
 var ring=DEF_RING[key]||Z_RING[key]||'#c9a441';
 c.fillStyle=ring;c.beginPath();c.arc(36,36,DISC_R,0,TAU);c.fill();   // 圆形底座
 if(rec.ok&&rec.el){
  c.save();c.beginPath();c.arc(36,36,30,0,TAU);c.clip();
  var sz=30*2*1.16;                                                  // 放大1.16倍超出底座
  try{c.drawImage(rec.el,36-sz/2,36-sz/2,sz,sz);}catch(e){}
  c.restore();
 }else{                                                               // 回退：色盘+姓氏
  c.fillStyle='#fff8ec';c.font='bold 30px "PingFang SC","Microsoft YaHei",sans-serif';
  c.textAlign='center';c.textBaseline='middle';
  c.fillText(HERO_CHAR[key]||'?',36,38);
 }
 c.strokeStyle='#f8d878';c.lineWidth=3;c.beginPath();c.arc(36,36,31.5,0,TAU);c.stroke(); // 金边
 rec.disc=cv;return cv;
}
/* 绘制头部圆盘，flip=true 时镜像面向左（仅 transform，无 clip） */
function drawDiscAt(key,x,y,r,flip){
 var cv=makeDisc(key);
 ctx.save();ctx.translate(x,y);
 if(cv){
  var k=r/DISC_R;ctx.scale(flip?-k:k,k);
  try{ctx.drawImage(cv,-DISC_SZ/2,-DISC_SZ/2);}catch(e){}
 }else{
  ctx.fillStyle=DEF_RING[key]||Z_RING[key]||'#c9a441';C(0,0,r);
  ctx.strokeStyle='#f8d878';ctx.lineWidth=2;CS(0,0,r);
 }
 ctx.restore();
}

/* ================= BGM（压缩版128kbps，首次交互后load+play，失败重试一次） ================= */
var bgm=null,bgmMuted=false,bgmUnlocked=false,bgmRetried=false;
try{
 bgm=new Audio('assets/bgm.mp3');
 bgm.preload='auto';
 bgm.loop=true;bgm.volume=0.45;
}catch(e){bgm=null;}
function bgmPlay(){
 if(!bgm||bgmUnlocked)return;
 try{bgm.load();}catch(e){}
 try{
  var pr=bgm.play();
  if(pr&&pr.then){
   pr.then(function(){bgmUnlocked=true;}).catch(function(){
    if(bgmRetried)return;bgmRetried=true;
    setTimeout(function(){                                     // 失败重试一次
     if(bgmUnlocked||!bgm)return;
     try{
      var p2=bgm.play();
      if(p2&&p2.then)p2.then(function(){bgmUnlocked=true;}).catch(function(){});
      else bgmUnlocked=true;
     }catch(e){}
    },600);
   });
  }else bgmUnlocked=true;
 }catch(e){}
}
if(typeof window!=='undefined'&&window.addEventListener){
 window.addEventListener('pointerdown',bgmPlay);
 window.addEventListener('keydown',bgmPlay);
}
function toggleMute(){bgmMuted=!bgmMuted;if(bgm)bgm.muted=bgmMuted;return bgmMuted;}
function endDip(){                                  // 胜利/失败时短暂压低音量再恢复
 if(!bgm)return;
 bgm.volume=0.2;
 setTimeout(function(){if(bgm)bgm.volume=0.45;},2500);
}

/* ================= 核心逻辑 ================= */
function reset(){
 state='playing';paused=false;speed=1;time=0;sun=150;kills=0;
 defenders.length=0;zombies.length=0;projectiles.length=0;
 particles.length=0;texts.length=0;pickups.length=0;
 grid=[];var r,c;
 for(r=0;r<5;r++){var row=[];for(c=0;c<9;c++)row.push(null);grid.push(row);}
 mowers.length=0;for(r=0;r<5;r++)mowers.push({row:r,x:78,active:false,used:false});
 cardCd={};for(var i=0;i<CARDS.length;i++)cardCd[CARDS[i].key]=0;
 selected=-1;hoverCell=null;cellFlash=null;
 wave=0;queue.length=0;spawnT=0;interT=2.5;banner='';bannerT=0;skyT=2.5;sunFlash=0;
 if(bgm)bgm.volume=0.45;
}
function plant(key,row,col){
 if(state!=='playing'||paused)return false;
 var card=null,i;
 for(i=0;i<CARDS.length;i++)if(CARDS[i].key===key)card=CARDS[i];
 if(!card||row<0||row>4||col<0||col>8)return false;
 if(grid[row][col])return false;          // 禁复种
 if(sun<card.cost)return false;           // 阳光不足
 if(cardCd[key]>0)return false;           // 冷却中
 sun-=card.cost;cardCd[key]=card.cd;
 var d={key:key,name:card.name,row:row,col:col,x:cellCX(col),y:cellCY(row)+30,
        hp:card.hp,maxHp:card.hp,t:0,ph:Math.random()*TAU,
        anim:(key==='ang'?'chant':'idle'),animT:0,hitT:0,pluckT:0,recoil:0,recoilSide:0,
        volley:0,volleyT:0,fireT:(key==='cai'?6:0.5),chant:(key==='ang'?1.0:0)};
 grid[row][col]=d;defenders.push(d);
 burst(d.x,d.y-30,'#fff2b8',8,90);
 return true;
}
function removeDefender(d){
 if(grid[d.row]&&grid[d.row][d.col]===d)grid[d.row][d.col]=null;
 var i=defenders.indexOf(d);if(i>=0)defenders.splice(i,1);
 burst(d.x,d.y-28,'#c8e8a8',10,110);
}
function spawnZombie(type,row,x){
 var df=ZDEF[type];
 if(row===undefined||row===null)row=Math.floor(Math.random()*5);
 var z={type:type,name:df.name,row:row,x:(x===undefined?934:x),y:cellCY(row)+32,
        hp:df.hp,maxHp:df.hp,spd:df.speed,dmg:df.dmg,atkCd:df.atkCd,r:df.r,
        atkT:0,slow:0,dead:false,deadT:0,bubble:df.bubble,boss:!!df.boss,
        swing:0,anim:'walk',hitT:0,ph:Math.random()*TAU};
 zombies.push(z);
 if(df.boss&&state==='playing'){banner='吕布来袭！';bannerT=2.2;}
 return z;
}
function killZombie(z){
 if(z.dead)return;
 z.dead=true;z.anim='dead';z.deadT=1.5;kills++;
 burst(z.x,z.y-36,'#d8e0e8',10,110);
}
function zombieAhead(row,x){
 for(var i=0;i<zombies.length;i++){var z=zombies[i];if(!z.dead&&z.row===row&&z.x>x-6)return true;}
 return false;
}

/* ---------- 特效生成 ---------- */
function burst(x,y,color,n,spd){
 for(var i=0;i<n;i++){var a=Math.random()*TAU,v=spd*(0.4+Math.random()*0.6);
  pushArr(particles,{x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-40,t:0.5+Math.random()*0.3,mt:0.8,c:color,r:2+Math.random()*2.5},MAX_PARTICLES);}
}
function sparkFx(x,y,kind){burst(x,y,kind==='arrow'?'#f8c93a':(kind==='bullet'?'#ffe08a':'#fff'),5,70);}
function hitFx(x,y,block){burst(x,y,block?'#ffd75a':'#ffb84a',block?12:6,block?140:90);}
function iceFx(x,y){burst(x,y,'#a8dcf5',8,70);pushTxt({x:x,y:y-26,t:0.8,text:'❄',color:'#7fc8f0',size:18});}
function noteFx(x,y){pushTxt({x:x+(Math.random()*20-10),y:y,t:1.2,text:'🎵',color:'#f06a9a',size:18});}
function boomFx(x,y){
 burst(x,y,'#ff8a3a',26,230);burst(x,y,'#ffd75a',16,150);burst(x,y,'#e0483a',12,180);
 pushTxt({x:x,y:y-44,t:1.0,text:'轰！',color:'#ff6a2a',size:34});
}

/* ---------- 安琪拉大招 ---------- */
function angelaBoom(d){
 var r0=Math.max(0,d.row-1),r1=Math.min(4,d.row+1);
 for(var i=0;i<zombies.length;i++){var z=zombies[i];if(z.dead)continue;
  var zc=Math.floor((z.x-LAWN.x)/LAWN.cw);
  if(z.row>=r0&&z.row<=r1&&zc>=d.col-1&&zc<=d.col+1){z.hp=0;killZombie(z);}
 }
 boomFx(d.x,d.y-30);
 removeDefender(d);
}

/* ---------- 防守方更新（含动画状态机 idle/attack/chant/hit） ---------- */
function updDefenders(dt){
 for(var i=defenders.length-1;i>=0;i--){
  var d=defenders[i];d.t+=dt;
  if(d.animT>0){d.animT-=dt;if(d.animT<=0&&d.anim!=='chant')d.anim='idle';}
  if(d.hitT>0)d.hitT-=dt;
  if(d.pluckT>0)d.pluckT-=dt;
  if(d.recoil>0)d.recoil-=dt;
  if(d.key==='cai'){
   d.fireT-=dt;
   if(d.fireT<=0){d.fireT=6;d.anim='attack';d.animT=0.9;d.pluckT=0.9;
    pushArr(pickups,{x:d.x,y:d.y-56,ty:d.y-56,vy:0,value:50,life:9,fromSky:false},MAX_PICKUPS);
    noteFx(d.x-10,d.y-66);noteFx(d.x+12,d.y-74);}
  }else if(d.key==='hou'){
   d.fireT-=dt;
   if(d.fireT<=0){
    if(zombieAhead(d.row,d.x)){d.fireT=1.0;d.anim='attack';d.animT=0.45;
     pushArr(projectiles,{kind:'arrow',x:d.x+26,y:d.y-38,row:d.row,vx:420,dmg:40},MAX_PROJ);}
    else d.fireT=0.2;
   }
  }else if(d.key==='wang'){
   d.fireT-=dt;
   if(d.fireT<=0){
    if(zombieAhead(d.row,d.x)){d.fireT=2.0;d.anim='attack';d.animT=0.5;
     pushArr(projectiles,{kind:'ice',x:d.x+22,y:d.y-54,row:d.row,vx:320,dmg:12,slow:3},MAX_PROJ);}
    else d.fireT=0.2;
   }
  }else if(d.key==='lu'){
   if(d.volley>0){
    d.volleyT-=dt;
    if(d.volleyT<=0){d.volley--;d.volleyT=0.15;
     d.anim='attack';d.animT=0.28;d.recoil=0.16;d.recoilSide=d.volley%2;
     pushArr(projectiles,{kind:'bullet',x:d.x+28,y:d.y-30+(d.volley%2)*10,row:d.row,vx:520,dmg:25},MAX_PROJ);}
   }else{
    d.fireT-=dt;
    if(d.fireT<=0){
     if(zombieAhead(d.row,d.x)){d.fireT=1.2;d.volley=2;d.volleyT=0;}
     else d.fireT=0.2;
    }
   }
  }else if(d.key==='ang'){
   d.chant-=dt;
   if(d.chant<=0)angelaBoom(d);
  }
  // xiang 纯肉盾，无攻击（被击时举剑格挡，见 hit 状态）
 }
}

/* ---------- 进攻方更新（含动画状态机 walk/attack/dead + hitT受击） ---------- */
function updZombies(dt){
 for(var i=zombies.length-1;i>=0;i--){
  var z=zombies[i];
  if(z.dead){z.deadT-=dt;if(z.deadT<=0)zombies.splice(i,1);continue;}
  if(z.swing>0)z.swing-=dt;
  if(z.hitT>0)z.hitT-=dt;
  var eff=z.slow>0?0.4:1;               // 冰冻减速60%（动作同步变慢）
  if(z.slow>0)z.slow-=dt;
  var blk=null;
  for(var j=0;j<defenders.length;j++){var d=defenders[j];
   if(d.row!==z.row)continue;
   if(z.x-d.x>4&&z.x-d.x<z.r+30){blk=d;break;}}
  if(blk){
   z.anim='attack';z.atkT-=dt*eff;
   if(z.atkT<=0){z.atkT=z.atkCd;z.swing=0.25;
    blk.hp-=z.dmg;blk.hitT=0.3;blk.anim='hit';blk.animT=0.3;
    hitFx(blk.x+14,blk.y-32,blk.key==='xiang');
    if(blk.hp<=0)removeDefender(blk);}
  }else{
   z.anim='walk';z.x-=z.spd*eff*dt;z.ph+=dt*6*eff;
  }
  if(!z.dead){
   var m=mowers[z.row];
   if(z.x<=100&&!m.used&&!m.active)m.active=true;   // 触发超级兵小推车
   if(z.x<72&&m.used){state='lose';endDip();}        // 水晶告破
  }
 }
}

/* ---------- 小推车 ---------- */
function updMowers(dt){
 for(var i=0;i<mowers.length;i++){
  var m=mowers[i];if(!m.active)continue;
  m.x+=300*dt;
  for(var j=0;j<zombies.length;j++){var z=zombies[j];
   if(!z.dead&&z.row===m.row&&z.x<m.x+34){z.hp=0;killZombie(z);}}
  if(m.x>1010){m.active=false;m.used=true;}
 }
}

/* ---------- 子弹 ---------- */
function updProj(dt){
 for(var i=projectiles.length-1;i>=0;i--){
  var p=projectiles[i];p.x+=p.vx*dt;
  if(p.x>980){projectiles.splice(i,1);continue;}
  for(var j=0;j<zombies.length;j++){
   var z=zombies[j];if(z.dead||z.row!==p.row)continue;
   if(Math.abs(p.x-z.x)<z.r+4){
    z.hp-=p.dmg;z.hitT=0.25;
    if(p.kind==='ice'){z.slow=3;iceFx(z.x,z.y-44);}else sparkFx(p.x,p.y,p.kind);
    if(z.hp<=0)killZombie(z);
    projectiles.splice(i,1);break;
   }
  }
 }
}

/* ---------- 波次 ---------- */
function startWave(){
 wave++;banner='第 '+wave+' / 5 波';bannerT=2.5;
 queue.length=0;
 var comp=WAVES[wave-1],i,k;
 for(i=0;i<comp.length;i++)for(k=0;k<comp[i][1];k++)queue.push(comp[i][0]);
 for(i=queue.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=queue[i];queue[i]=queue[j];queue[j]=t;}
 spawnT=1.0;
}
function updWaves(dt){
 if(queue.length>0){
  spawnT-=dt;

/* ---------- 阳光/粒子/文字 ---------- */
function updPickups(dt){
 for(var i=pickups.length-1;i>=0;i--){
  var p=pickups[i];
  if(p.y<p.ty){p.y+=p.vy*dt;if(p.y>p.ty)p.y=p.ty;}
  p.life-=dt;if(p.life<=0)pickups.splice(i,1);
 }
}
function updFx(dt){
 var i;
 for(i=particles.length-1;i>=0;i--){var p=particles[i];
  p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=170*dt;p.t-=dt;if(p.t<=0)particles.splice(i,1);}
 for(i=texts.length-1;i>=0;i--){var t=texts[i];t.y-=28*dt;t.t-=dt;if(t.t<=0)texts.splice(i,1);}
}
function collectAll(){
 for(var i=0;i<pickups.length;i++)sun+=pickups[i].value;
 pickups.length=0;
}
/* 一键收集（R键/手机按钮）：带计数器闪光与“+xxx”飘字反馈 */
var sunFlash=0;
function collectAllFx(){
 var total=0,i;
 for(i=0;i<pickups.length;i++)total+=pickups[i].value;

 sunFlash=0.7;
 pushTxt({x:64,y:30,t:1.0,text:'+'+total,color:'#f8b920',size:20});

}

/* ---------- 主更新 ---------- */
function update(dt){

 dt*=speed;time+=dt;
 if(bannerT>0)bannerT-=dt;
 if(sunFlash>0)sunFlash-=dt;
 if(cellFlash){cellFlash.t-=dt;if(cellFlash.t<=0)cellFlash=null;}
 for(var k in cardCd)if(cardCd[k]>0)cardCd[k]-=dt;
 skyT-=dt;
 if(skyT<=0){skyT=4;
  pushArr(pickups,{x:LAWN.x+40+Math.random()*(LAWN_R-LAWN.x-80),y:LAWN.y+10,
   ty:LAWN.y+70+Math.random()*(LAWN_B-LAWN.y-140),vy:55,value:25,life:11,fromSky:true},MAX_PICKUPS);}
 updPickups(dt);updDefenders(dt);updZombies(dt);updMowers(dt);updProj(dt);updWaves(dt);updFx(dt);
}

  ctx.fillStyle='#fff';ctx.fillText(Math.ceil(cd)+'s',r.x+r.w/2,r.y+r.h/2+6);
 }else if(!afford){
  ctx.fillStyle='rgba(90,90,90,0.28)';RR(r.x,r.y,r.w,r.h,8);ctx.fill();
 }
}
function drawHUD(){
 ctx.fillStyle='rgba(255,250,235,0.95)';RR(6,6,124,84,10);ctx.fill();
 ctx.strokeStyle='#c9b78a';ctx.lineWidth=2;RR(6,6,124,84,10);ctx.stroke();
 drawSunIcon(36,36,21);
 if(sunFlash>0){                                                  // 一键收集闪光反馈
  ctx.globalAlpha=Math.max(0,Math.min(1,sunFlash*1.6));
  ctx.strokeStyle='#ffe98a';ctx.lineWidth=3.5;CS(36,36,26+(0.7-sunFlash)*14);
  ctx.globalAlpha=1;
 }
 ctx.font='bold 26px "PingFang SC","Microsoft YaHei",sans-serif';ctx.textAlign='left';
 ctx.fillStyle='#7a5a1a';ctx.fillText(''+sun,64,45);
 ctx.font='12px "PingFang SC","Microsoft YaHei",sans-serif';
 ctx.fillStyle='#a08a5a';ctx.fillText('阳光',64,64);
 for(var i=0;i<CARDS.length;i++)drawCard(i);
 drawBtn(BTN_PAUSE,paused?'继续':'暂停');
 drawBtn(BTN_SPEED,'x'+speed);
 drawBtn(BTN_MUTE,bgmMuted?'🔇':'🔊');
 // ☀️一键收集（手机友好，R键同效）
 var bc=BTN_COLLECT;
 ctx.fillStyle=state==='playing'?'#ffd75a':'#e0d5b8';RR(bc.x,bc.y,bc.w,bc.h,10);ctx.fill();
 ctx.strokeStyle='#b98a2e';ctx.lineWidth=2.5;RR(bc.x,bc.y,bc.w,bc.h,10);ctx.stroke();
 ctx.textAlign='center';
 ctx.font='bold 16px "PingFang SC","Microsoft YaHei",sans-serif';
 ctx.fillStyle='#5a3a1a';ctx.fillText('☀️ 一键收集',bc.x+bc.w/2,bc.y+19);
 ctx.font='10px "PingFang SC","Microsoft YaHei",sans-serif';
 ctx.fillStyle='#9a7a3a';ctx.fillText('按 R 快捷收集',bc.x+bc.w/2,bc.y+35);
 // 底部信息条
 ctx.font='bold 16px "PingFang SC","Microsoft YaHei",sans-serif';
 ctx.fillStyle='#6a4a2a';ctx.textAlign='left';
 ctx.fillText('第 '+Math.max(1,wave)+' / 5 波',16,LAWN_B+27);
 var alive=queue.length;
 for(i=0;i<zombies.length;i++)if(!zombies[i].dead)alive++;
 ctx.textAlign='center';
 if(state==='playing'&&time<8)ctx.fillText('点卡片，再点草坪召唤英雄',W/2,LAWN_B+27);
 else ctx.fillText('剩余敌人 '+alive,W/2,LAWN_B+27);
 ctx.textAlign='right';ctx.fillText('击杀 '+kills,764,LAWN_B+27);
}
function drawBanner(){
 if(bannerT<=0)return;
 ctx.globalAlpha=Math.max(0,Math.min(1,bannerT/0.6));
 ctx.font='bold 44px "PingFang SC","Microsoft YaHei",sans-serif';ctx.textAlign='center';
 ctx.lineWidth=8;ctx.strokeStyle='rgba(90,50,20,0.85)';ctx.strokeText(banner,W/2,300);
 ctx.fillStyle='#ffe98a';ctx.fillText(banner,W/2,300);
 ctx.globalAlpha=1;
}
function drawBigBtn(r,label){
 ctx.fillStyle='#f8c93a';RR(r.x,r.y,r.w,r.h,12);ctx.fill();
 ctx.strokeStyle='#b98a2e';ctx.lineWidth=3;RR(r.x,r.y,r.w,r.h,12);ctx.stroke();
 ctx.font='bold 26px "PingFang SC","Microsoft YaHei",sans-serif';ctx.textAlign='center';
 ctx.fillStyle='#5a3a1a';ctx.fillText(label,r.x+r.w/2,r.y+r.h/2+9);
}
function drawOverlays(){
 if(state==='menu'){
  ctx.fillStyle='rgba(30,42,30,0.6)';ctx.fillRect(0,0,W,H);
  ctx.font='bold 58px "PingFang SC","Microsoft YaHei",sans-serif';ctx.textAlign='center';
  ctx.lineWidth=10;ctx.strokeStyle='#7a4a1a';ctx.strokeText('王者峡谷守卫战',W/2,170);
  ctx.fillStyle='#ffe98a';ctx.fillText('王者峡谷守卫战',W/2,170);
  ctx.font='20px "PingFang SC","Microsoft YaHei",sans-serif';ctx.fillStyle='#fff';
  ctx.fillText('植物大战僵尸玩法 × 王者荣耀英雄',W/2,215);
  ctx.font='18px "PingFang SC","Microsoft YaHei",sans-serif';ctx.fillStyle='#cfe8b8';
  ctx.fillText('点卡片，再点草坪召唤英雄，守住水晶！',W/2,250);
  drawBigBtn(BTN_START,'开始游戏');
  drawDefUnit('cai',150,522,1.2,vclock,null);                  // 主菜单大头Q版全身秀
  drawDefUnit('hou',285,522,1.2,vclock,null);
  drawDefUnit('wang',655,522,1.2,vclock,null);
  drawDefUnit('ang',795,522,1.2,vclock,null);
 }else if(state==='win'||state==='lose'){
  ctx.fillStyle='rgba(20,26,20,0.62)';ctx.fillRect(0,0,W,H);
  ctx.fillStyle=state==='win'?'rgba(255,248,220,0.97)':'rgba(245,235,225,0.97)';
  RR(W/2-260,150,520,280,16);ctx.fill();
  ctx.strokeStyle=state==='win'?'#f8c93a':'#b0988a';ctx.lineWidth=4;RR(W/2-260,150,520,280,16);ctx.stroke();
  ctx.textAlign='center';
  ctx.font='bold 46px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillStyle=state==='win'?'#e8a81a':'#a05a4a';
  ctx.fillText(state==='win'?'胜利！峡谷守住了！':'水晶被摧毁了…',W/2,225);
  ctx.font='19px "PingFang SC","Microsoft YaHei",sans-serif';ctx.fillStyle='#6a5a4a';
  ctx.fillText('用时 '+Math.floor(time)+' 秒　击杀 '+kills+' 名敌人',W/2,268);
  ctx.font='16px "PingFang SC","Microsoft YaHei",sans-serif';ctx.fillStyle='#8a7a6a';
  ctx.fillText(state==='win'?'蔡文姬的琴声响彻峡谷！':'别灰心，再排兵布阵一次吧！',W/2,300);
  drawBigBtn(BTN_RESTART,'重新开始');
 }else if(paused){
  ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(0,0,W,H);
  ctx.font='bold 42px "PingFang SC","Microsoft YaHei",sans-serif';ctx.textAlign='center';
  ctx.fillStyle='#fff';ctx.fillText('已暂停',W/2,280);
  ctx.font='17px "PingFang SC","Microsoft YaHei",sans-serif';ctx.fillStyle='#cfe8b8';
  ctx.fillText('点击右上角「继续」返回战斗',W/2,318);
 }
}

/* ================= 主绘制 ================= */
function draw(){
 var k=canvas.width/W;
 ctx.setTransform(k,0,0,k,0,0);
 var shx=0,shy=0,i;
 for(i=0;i<zombies.length;i++){var z=zombies[i];
  if(z.boss&&!z.dead&&z.anim==='walk'){shy=Math.sin(z.ph*3)*1.3;shx=Math.cos(z.ph*2.3)*0.9;break;}}
 if(bgCache)ctx.drawImage(bgCache,0,0);                          // 静态背景一次性 blit
 ctx.save();ctx.translate(shx,shy);
 drawGroundDyn();
 for(i=0;i<mowers.length;i++)drawMower(mowers[i]);
 for(i=0;i<pickups.length;i++)drawPickup(pickups[i]);
 drawUnitLayer();
 for(i=0;i<projectiles.length;i++)drawProj(projectiles[i]);
 drawFx();
 if(state==='playing'&&!paused&&selected>=0&&hoverCell&&!grid[hoverCell.r][hoverCell.c]){
  ctx.globalAlpha=0.55;
  drawDefUnit(CARDS[selected].key,cellCX(hoverCell.c),cellCY(hoverCell.r)+30,1,vclock,null);
  ctx.globalAlpha=1;
 }
 ctx.restore();
 drawHUD();
 drawBanner();
 drawOverlays();
}

/* ================= 输入（pointer统一触摸/鼠标） ================= */
function toGame(e){
 var r=canvas.getBoundingClientRect();
 return {x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};
}
function cellFrom(x,y){
 if(x<LAWN.x||x>=LAWN_R||y<LAWN.y||y>=LAWN_B)return null;
 return {c:Math.floor((x-LAWN.x)/LAWN.cw),r:Math.floor((y-LAWN.y)/LAWN.ch)};
}
function onTap(x,y){
 var i;
 if(inR(x,y,BTN_MUTE)){toggleMute();return;}                // 静音切换全状态可用
 if(state==='menu'){if(inR(x,y,BTN_START)){bgmPlay();reset();}return;}
 if(state==='win'||state==='lose'){if(inR(x,y,BTN_RESTART)){bgmPlay();reset();}return;}
 if(inR(x,y,BTN_PAUSE)){paused=!paused;return;}
 if(paused)return;
 if(inR(x,y,BTN_SPEED)){speed=speed===1?2:1;return;}
 if(inR(x,y,BTN_COLLECT)){collectAllFx();return;}           // 手机一键收集
 for(i=pickups.length-1;i>=0;i--){                         // 点阳光（判定半径36）
  var p=pickups[i],dx=x-p.x,dy=y-p.y;
  if(dx*dx+dy*dy<36*36){
   sun+=p.value;pickups.splice(i,1);
   pushTxt({x:64,y:38,t:0.9,text:'+'+p.value,color:'#f8b920',size:18});
   return;
  }
 }
 for(i=0;i<CARDS.length;i++){
  if(inR(x,y,cardRect(i))){
   if(selected===i)selected=-1;
   else if(cardCd[CARDS[i].key]<=0)selected=i;
   return;
  }
 }
 var cell=cellFrom(x,y);
 if(cell&&selected>=0){
  var ok=plant(CARDS[selected].key,cell.r,cell.c);
  if(ok){selected=-1;cellFlash={r:cell.r,c:cell.c,color:'rgba(120,255,120,0.5)',t:0.3};}
  else{
   cellFlash={r:cell.r,c:cell.c,color:'rgba(255,80,80,0.5)',t:0.3};
   pushTxt({x:cellCX(cell.c),y:cellCY(cell.r)-16,t:0.9,
    text:grid[cell.r][cell.c]?'这里已经有英雄啦':'阳光不足',color:'#ff5a4a',size:16});
  }
 }
}
canvas.addEventListener('pointerdown',function(e){e.preventDefault();var p=toGame(e);onTap(p.x,p.y);});
canvas.addEventListener('pointermove',function(e){var p=toGame(e);mouse=p;hoverCell=cellFrom(p.x,p.y);});
window.addEventListener('keydown',function(e){               // R键一键收集阳光
 if(e.key==='r'||e.key==='R'){
  if(state==='playing'&&!paused)collectAllFx();
 }
});

/* ================= 适配与主循环 ================= */
function resize(){
 var dpr=window.devicePixelRatio||1;
 var ww=window.innerWidth||W,wh=window.innerHeight||H;
 var s=Math.min(ww/W,wh/H);
 canvas.style.width=(W*s)+'px';
 canvas.style.height=(H*s)+'px';
 canvas.width=Math.max(1,Math.round(W*s*dpr));
 canvas.height=Math.max(1,Math.round(H*s*dpr));
 var hint=document.getElementById('hint');
 if(hint)hint.style.display=(wh>ww)?'block':'none';
}
window.addEventListener('resize',resize);
resize();
buildBG();
var lastTs=0,vclock=0;                               // vclock：视觉动画时钟（菜单也走）
function frame(ts){
 var dt=lastTs?Math.min(0.05,(ts-lastTs)/1000):0.016;
 lastTs=ts;vclock+=dt;
 update(dt);draw();
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ================= 调试/测试接口 ================= */
window.GAME={
 getState:function(){return state;},
 getSun:function(){return sun;},
 addSun:function(n){sun+=n;},
 getWave:function(){return wave;},
 getKills:function(){return kills;},
 isPaused:function(){return paused;},
 start:reset,restart:reset,
 plant:plant,
 spawnZombie:spawnZombie,
 step:function(dt){update(dt);},
 draw:draw,tap:onTap,
 setSpeed:function(s){speed=s;},
 setPaused:function(b){paused=b;},
 collectAll:collectAll,
 collectAllFx:collectAllFx,
 toggleMute:toggleMute,
 isMuted:function(){return bgmMuted;},
 getBgm:function(){return bgm;},
 imgsOk:function(){var r={};for(var k in IMG_SRC)r[k]=!!(IMG_CACHE[k]&&IMG_CACHE[k].ok);return r;},
 discsOk:function(){var n=0;for(var k in IMG_CACHE)if(IMG_CACHE[k].disc)n++;return n;},
 anims:function(){var d=[],z=[],i;for(i=0;i<defenders.length;i++)d.push(defenders[i].anim);for(i=0;i<zombies.length;i++)z.push(zombies[i].anim);return {d:d,z:z};},
 getSunFlash:function(){return sunFlash;},
 BTN_MUTE:BTN_MUTE,BTN_COLLECT:BTN_COLLECT,
 defenders:defenders,zombies:zombies,projectiles:projectiles,pickups:pickups,mowers:mowers,
 gridRef:function(){return grid;},
 CARDS:CARDS
};
})();
</script>
